<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Movie Ticket Management System</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="topbar">
        <a class="logo" href="index.html">MTMS</a>
        <nav><a href="index.html">Home</a><a href="register.html">Sign Up</a></nav>
    </header>

    <main class="form-page">
        <form class="form-card" id="loginForm">
            <p class="tag">WELCOME BACK</p>
            <h1>Login</h1>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
            <label for="role">Login as</label>
            <select id="role">
                <option value="">Select your role</option>
                <option value="admin">Admin</option>
                <option value="buyer">Ticket Buyer</option>
                <option value="employee">Employee</option>
                <option value="renter">Theater Renter</option>
            </select>
            <p class="error" id="loginError"></p>
            <button class="button full-button" type="submit">Login</button>
            <div class="demo-box">
                <p class="demo-title">Demo accounts (click to fill)</p>
                <table class="demo-table">
                    <tr><th>Role</th><th>Email</th><th>Password</th></tr>
                    <tr class="demo-row" data-role="admin" data-email="admin@mtms.com" data-password="admin123"><td>Admin</td><td>admin@mtms.com</td><td>admin123</td></tr>
                    <tr class="demo-row" data-role="buyer" data-email="buyer@mtms.com" data-password="buyer123"><td>Ticket Buyer</td><td>buyer@mtms.com</td><td>buyer123</td></tr>
                    <tr class="demo-row" data-role="employee" data-email="employee@mtms.com" data-password="staff123"><td>Employee</td><td>employee@mtms.com</td><td>staff123</td></tr>
                    <tr class="demo-row" data-role="renter" data-email="renter@mtms.com" data-password="renter123"><td>Theater Renter</td><td>renter@mtms.com</td><td>renter123</td></tr>
                </table>
            </div>
            <p class="form-bottom">Don't have an account? <a href="register.html">Sign up</a></p>

        </form>
    </main>
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
